<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aika 情感语音 · 情绪识别 Demo</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1f2430;
    --ink-2: #5b6472;
    --line: #e6e8ee;
    --brand: #7c5cff;
    --brand-soft: #efeaff;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    padding-bottom: 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* 顶栏 */
  header { padding: 20px 0 8px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #7c5cff, #b58cff);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex: 0 0 auto;
  }
  .title h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .title .sub { font-size: 13px; color: var(--ink-2); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd2dd; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  .dot.busy { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.15); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 布局 */
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-top: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .card-b { padding: 18px; }

  /* 输入区 */
  .seg { display: flex; background: #f0f1f5; border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 9px 6px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; transition: all .15s;
  }
  .seg button.on { background: #fff; color: var(--brand); box-shadow: 0 1px 3px rgba(16,24,40,.1); }

  .panel { display: none; }
  .panel.on { display: block; }

  .big-btn {
    width: 100%; padding: 15px; border: 1.5px dashed #c9cfe0; border-radius: 12px;
    background: #fafbfd; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .15s; text-align: center;
  }
  .big-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .big-btn.rec { border-color: #e05a4e; color: #e05a4e; background: #fdf1f0; }
  .hint { font-size: 12px; color: #9aa1ae; margin-top: 10px; text-align: center; }

  select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .demo-note { font-size: 12px; color: #9aa1ae; margin-top: 8px; }

  /* 结果区 */
  .empty { text-align: center; color: #9aa1ae; padding: 60px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .top-result { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
  .top-emoji { font-size: 46px; }
  .top-meta .ja { font-size: 30px; font-weight: 800; letter-spacing: .02em; }
  .top-meta .zh { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .top-meta .conf { font-size: 13px; font-weight: 700; color: var(--brand); margin-top: 4px; }
  .meta-line { font-size: 12px; color: #9aa1ae; margin: 0 0 16px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 82px; flex: 0 0 auto; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .bar-label .em { font-size: 16px; }
  .bar-track { flex: 1; height: 14px; background: #f0f1f5; border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; transition: width .4s cubic-bezier(.22,1,.36,1); }
  .bar-val { width: 48px; flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* mood 对照 */
  .mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .mood-grid { grid-template-columns: repeat(2, 1fr); } }
  .mood {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .mood .swatch { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; }
  .mood .m-ja { font-size: 15px; font-weight: 700; }
  .mood .m-zh { font-size: 11px; color: #9aa1ae; }
  .mood .m-arrow { margin-left: auto; font-size: 12px; color: #9aa1ae; }
  .mood .m-pred { font-size: 12px; font-weight: 600; color: var(--brand); }

  /* 历史 */
  .hist { list-style: none; }
  .hist li {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f1f5;
  }
  .hist li:last-child { border-bottom: none; }
  .hist .h-em { font-size: 22px; }
  .hist .h-info { flex: 1; min-width: 0; }
  .hist .h-src { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .h-meta { font-size: 11px; color: #9aa1ae; }
  .hist .h-tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; flex: 0 0 auto; }

  .foot { text-align: center; font-size: 12px; color: #9aa1ae; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo">A</div>
      <div class="title">
        <h1>Aika 情感语音 · 情绪识别</h1>
        <div class="sub">acoustic-only SER · emotion2vec+ large · 纯声学、不看词义</div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
    </div>
  </header>

  <div class="grid">
    <!-- 左：输入 -->
    <div class="card">
      <div class="card-h">输入音频</div>
      <div class="card-b">
        <div class="seg" id="seg">
          <button class="on" data-panel="rec">🎙 录音</button>
          <button data-panel="up">📁 上传</button>
          <button data-panel="demo">🎵 Demo</button>
        </div>

        <div class="panel on" id="panel-rec">
          <button class="big-btn" id="recBtn">开始录音（3 秒）</button>
          <div class="hint">授权麦克风后点击，自动录 3 秒并识别情绪</div>
        </div>

        <div class="panel" id="panel-up">
          <button class="big-btn" id="upBtn">选择音频文件</button>
          <input type="file" id="fileInput" accept="audio/*" hidden>
          <div class="hint">支持 wav / mp3 / flac / ogg</div>
        </div>

        <div class="panel" id="panel-demo">
          <select id="demoSelect"></select>
          <div class="demo-note" id="demoNote"></div>
          <button class="big-btn" id="demoPlay" style="margin-top:12px">▶ 播放并识别</button>
        </div>
      </div>
    </div>

    <!-- 右：结果 -->
    <div class="card">
      <div class="card-h">识别结果</div>
      <div class="card-b" id="resultBox">
        <div class="empty">
          <div class="big">🎧</div>
          <div>上传、录音或选一段 Demo 音频<br>模型将给出 9 类情绪的置信分数</div>
        </div>
      </div>
    </div>
  </div>

  <!-- mood 对照 -->
  <div class="card" style="margin-top:20px">
    <div class="card-h">6 种情绪 · 与 emotion2vec 预测的对照（M0 研究结论）</div>
    <div class="card-b">
      <div class="mood-grid" id="moodGrid"></div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="card" style="margin-top:20px">
    <div class="card-h">历史记录</div>
    <div class="card-b" style="padding-top:6px">
      <ul class="hist" id="hist"></ul>
    </div>
  </div>

  <div class="foot">Aika SER · emotion2vec+ (300M / 42526h) · 日语娇柔声线偏置是研究切入口</div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = ''; // 同源

// SER-05：动态文本一律 HTML 转义后才能进模板；颜色只接受 hex 字面量
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function safeColor(c) {
  return /^#[0-9a-fA-F]{3,8}$/.test(String(c ?? '')) ? c : '#888888';
}

// 情绪 emoji 映射
const EMOJI = { angry:'😠', disgusted:'🤢', fearful:'😨', happy:'😊', neutral:'😐', other:'🤔', sad:'😢', surprised:'😲', unknown:'❓' };

let meta = null;
let hist = [];
let audioCtx = null;

// ---- 初始化：加载 meta + 健康检查 ----
async function init() {
  try {
    const h = await fetch(API + '/health').then(r => r.json());
    setStatus(h.loaded || true ? 'ok' : 'ok', '模型 ' + h.model);
  } catch(e) { setStatus('busy', '等待服务启动…'); setTimeout(init, 2000); return; }

  try {
    meta = await fetch(API + '/meta').then(r => r.json());
    renderDemos(); renderMoods();
  } catch(e) { console.error(e); }
}

function setStatus(state, text) {
  const d = $('#dot'); d.className = 'dot ' + (state === 'ok' ? 'ok' : 'busy');
  $('#statusText').textContent = text;
}

// ---- 渲染 demo 下拉 + mood 对照 ----
function renderDemos() {
  const sel = $('#demoSelect');
  const groups = {};
  meta.demos.forEach(d => { (groups[d.group_name] ||= []).push(d); });
  let html = '';
  for (const [g, items] of Object.entries(groups)) {
    html += `<optgroup label="${esc(g)}">`;
    items.forEach(d => html += `<option value="${esc(d.path)}">${esc(d.zh)}（${esc(d.ja)}）</option>`);
    html += '</optgroup>';
  }
  sel.innerHTML = html;
  onDemoChange();
}

function onDemoChange() {
  const path = $('#demoSelect').value;
  const d = meta.demos.find(x => x.path === path);
  if (d) $('#demoNote').textContent = `来源：${d.group_name} · 参考预测：${EMOJI[d.ref_pred]} ${d.ja}`;
}

function renderMoods() {
  const g = $('#moodGrid');
  g.innerHTML = meta.moods.map(m => `
    <div class="mood">
      <div class="swatch" style="background:${safeColor(m.color)}"></div>
      <div><div class="m-ja">${esc(m.ja)}</div><div class="m-zh">${esc(m.zh)}</div></div>
      <div class="m-arrow">→</div>
      <div class="m-pred" style="color:${safeColor(m.color) || '#7c5cff'}">${esc(m.ref_pred)}</div>
    </div>`).join('');
}

// ---- 结果渲染 ----
function renderResult(r) {
  const top = r.scores[0];
  const bars = r.scores.map((s, i) => `
    <div class="bar-row">
      <div class="bar-label"><span class="em">${EMOJI[s.label] || '❓'}</span>${esc(s.ja)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(Number(s.score)*100).toFixed(1)}%;background:${safeColor(s.color)}"></div></div>
      <div class="bar-val">${(Number(s.score)*100).toFixed(1)}%</div>
    </div>`).join('');

  $('#resultBox').innerHTML = `
    <div class="top-result">
      <div class="top-emoji">${EMOJI[top.label] || '❓'}</div>
      <div class="top-meta">
        <div class="ja">${esc(top.ja)}</div>
        <div class="zh">${esc(top.zh)}</div>
        <div class="conf">置信 ${(Number(top.score)*100).toFixed(1)}%</div>
      </div>
    </div>
    <div class="meta-line">来源：${esc(r.src)} · 音频 ${esc(r.duration_s)}s · 推理 ${esc(r.elapsed_s)}s · 模型 ${esc(r.model)}</div>
    ${bars}`;

  // 历史
  hist.unshift({ src: r.src, ja: top.ja, emoji: EMOJI[top.label] || '❓', color: top.color, conf: top.score });
  hist = hist.slice(0, 8);
  renderHist();
}

function renderHist() {
  $('#hist').innerHTML = hist.map(h => `
    <li>
      <div class="h-em">${h.emoji}</div>
      <div class="h-info">
        <div class="h-src">${esc(h.src)}</div>
        <div class="h-meta">置信 ${(Number(h.conf)*100).toFixed(1)}%</div>
      </div>
      <div class="h-tag" style="background:${safeColor(h.color)}">${esc(h.ja)}</div>
    </li>`).join('') || '<li style="color:#9aa1ae;font-size:13px">暂无记录</li>';
}

// ---- 通用预测请求 ----
async function predict(formData, srcLabel) {
  setStatus('busy', '识别中…');
  try {
    const r = await fetch(API + '/predict', { method: 'POST', body: formData }).then(x => x.json());
    if (r.detail) throw new Error(r.detail);
    renderResult(r);
    setStatus('ok', '模型 ' + r.model);
  } catch(e) {
    setStatus('ok', '识别失败');
    $('#resultBox').innerHTML = `<div class="empty"><div class="big">⚠️</div><div>识别失败：${esc(e.message)}</div></div>`;
  }
}

// ---- 上传 ----
$('#upBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('file', f, f.name);
  predict(fd, f.name);
};

// ---- demo 音频 ----
$('#demoSelect').onchange = onDemoChange;
$('#demoPlay').onclick = async () => {
  const path = $('#demoSelect').value;
  // 播放
  const a = new Audio('/audio/' + path);
  a.volume = 0.8; a.play().catch(() => {});
  // 识别
  setStatus('busy', '识别中…');
  try {
    const r = await fetch(API + '/predict/path', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    }).then(x => x.json());
    if (r.detail) throw new Error(r.detail);
    const d = meta.demos.find(x => x.path === path);
    r.src = `${d.zh}（${d.ja}）· ${d.group_name}`;
    renderResult(r);
    setStatus('ok', '模型 ' + r.model);
  } catch(e) {
    setStatus('ok', '识别失败');
    $('#resultBox').innerHTML = `<div class="empty"><div class="big">⚠️</div><div>识别失败：${esc(e.message)}</div></div>`;
  }
};

// ---- 录音 ----
function audioBufferToWav(buffer) {
  const numCh = 1, sampleRate = buffer.sampleRate;
  const samples = buffer.getChannelData(0);
  const bytesPerSample = 2, blockAlign = numCh * bytesPerSample;
  const dataSize = samples.length * blockAlign;
  const buf = new ArrayBuffer(44 + dataSize);
  const v = new DataView(buf);
  const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+dataSize, true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,numCh,true); v.setUint32(24,sampleRate,true);
  v.setUint32(28,sampleRate*blockAlign,true); v.setUint16(32,blockAlign,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,dataSize,true);
  let off = 44;
  for (let i=0;i<samples.length;i++,off+=2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(off, s < 0 ? s*0x8000 : s*0x7fff, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

let recorder = null, recStream = null;
$('#recBtn').onclick = async () => {
  const btn = $('#recBtn');
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    recorder = new MediaRecorder(recStream);
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      recStream.getTracks().forEach(t => t.stop());
      btn.textContent = '开始录音（3 秒）'; btn.classList.remove('rec');
      const blob = new Blob(chunks, { type: 'audio/webm' });
      try {
        const ab = await blob.arrayBuffer();
        const audioBuf = await audioCtx.decodeAudioData(ab);
        const wav = audioBufferToWav(audioBuf);
        const fd = new FormData(); fd.append('file', wav, 'recording.wav');
        predict(fd, '🎙 录音');
      } catch(e) {
        $('#resultBox').innerHTML = `<div class="empty"><div class="big">⚠️</div><div>录音解码失败：${esc(e.message)}</div></div>`;
      }
    };
    recorder.start();
    btn.textContent = '停止录音'; btn.classList.add('rec');
    setTimeout(() => { if (recorder && recorder.state === 'recording') recorder.stop(); }, 3000);
  } catch(e) {
    $('#resultBox').innerHTML = `<div class="empty"><div class="big">⚠️</div><div>无法访问麦克风：${esc(e.message)}</div></div>`;
  }
};

// ---- 分段切换 ----
$('#seg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
  $('#panel-' + b.dataset.panel).classList.add('on');
};

init();
</script>
</body>
</html>
