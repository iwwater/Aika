name: Windows source checks
on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows/code/desktop-pet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: windows/code/desktop-pet/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3 esbuild
      - run: node node_modules/electron/install.js
      - run: npm run test:windows
      # Collect release regressions even if the separate platform checks fail.
      - run: npm run test:release
        if: success() || failure()
      # No credentials, private model/SDK, paid providers or device tests.
