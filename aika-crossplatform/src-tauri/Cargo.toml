[package]
name = "aika-crossplatform"
version = "0.3.0"
description = "A private Japanese conversation companion"
authors = ["Aika"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aika_crossplatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build`（CLI）会带上这个 feature；直接 cargo build 时必须显式给。
# 开着它，exe 才会把 frontendDist 嵌进二进制并用 tauri.localhost 加载；
# 不开则 Tauri 按 dev 环境处理，启动去连 devUrl（localhost:1420）——
# 没有 vite dev server 时整页失败，表现为白屏转黑的错误页
# （取证与结论见 docs/frontend/reports/ISSUE_tauri_webview_blank.md）。
# 手工构建：cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.9"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-notification = "2.4.0"
base64 = "0.23.1"
# 手机远程终端的 HTTP 服务。选它是因为够小、同步、不用把 async 运行时拖进来。
tiny_http = "0.12"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
