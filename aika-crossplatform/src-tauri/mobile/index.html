<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>愛花</title>
<!--
  手机端页面。

  刻意是一个手写的单文件页面，不是桌面那套 React：
  手机只是一块远程屏幕，越简单越不容易在 iOS Safari 上出意外，
  而且它由 Rust 直接 include_str! 进二进制，不需要第二条构建链。

  这里不存任何东西——记忆只有电脑上那一份。token 存在 sessionStorage，
  关掉标签页就没了，链接本身仍然是唯一的入口。
-->
<style>
  :root {
    --cyan: #37e6ff; --violet: #9a6bff; --ink: #e8f4ff; --muted: #8ea3c0;
    --line: rgba(120,160,220,.18); --bg: #05070e; --card: rgba(19,29,49,.9);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: radial-gradient(120% 80% at 50% 0%, #0b1428, var(--bg));
    color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; }
  header .dot.off { background: #ff4d92; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .04em; }
  header small { margin-left: auto; color: var(--muted); font-size: 11px; }
  main { flex: 1; overflow-y: auto; padding: 14px 14px 4px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: column; max-width: 86%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .meta { margin: 0 4px 3px; color: var(--muted); font-size: 10px; }
  .bubble {
    padding: 9px 12px; border-radius: 4px 14px 14px; background: var(--card);
    border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble {
    border-radius: 14px 4px 14px 14px; border: none; color: #04121a;
    background: linear-gradient(140deg, var(--cyan), var(--violet));
  }
  .row.error .bubble { color: #ffb8d1; background: rgba(40,10,26,.8); border-color: rgba(255,77,146,.35); }
  .translation { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  footer { padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--line); }
  .notice { margin: 0 0 8px; color: var(--muted); font-size: 11px; }
  .notice.bad { color: #ffb8d1; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-height: 44px; max-height: 140px; padding: 11px 12px; resize: none;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(10,16,28,.9);
    color: var(--ink); font: inherit; font-size: 16px; /* 16px 以下 iOS 会自动放大页面 */
  }
  button {
    height: 44px; padding: 0 18px; border: none; border-radius: 12px; color: #04121a;
    background: linear-gradient(140deg, var(--cyan), var(--violet)); font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>愛花</h1>
  <small id="status">连接中…</small>
</header>
<main id="list"></main>
<footer>
  <p class="notice" id="notice">电脑关机时这里就没有回应了——记忆只有电脑上那一份。</p>
  <form id="form">
    <textarea id="input" rows="1" placeholder="日语、中文、英语都可以" enterkeyhint="send"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</footer>
<script>
  // token 从链接里来，之后存进 sessionStorage：刷新还在，关掉标签页就没了。
  // 注意：`?t=` 只是**本次请求的凭证**，不是长期授权——新协议里它不换发任何东西。
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || sessionStorage.getItem("aika.token") || "";
  if (params.get("t")) {
    sessionStorage.setItem("aika.token", params.get("t"));
    history.replaceState(null, "", location.pathname);
  }

  const list = document.getElementById("list");
  const notice = document.getElementById("notice");
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");

  const CONVERSATION = params.get("conversation") || "local";

  let rendered = "";
  let sending = false;
  let epoch = null;      // 宿主 epoch；变化即要求重同步
  let cursor = null;     // 已消费到的 seq
  let polling = false;
  let stopped = false;

  function online(ok, text) {
    dot.className = ok ? "dot" : "dot off";
    status.textContent = text;
  }

  function say(text, bad) {
    notice.textContent = text;
    notice.className = bad ? "notice bad" : "notice";
  }

  async function call(path, options) {
    const response = await fetch(path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    });
    const data = await response.json().catch(() => ({}));
    // 202 是「已受理」而不是「已完成」——按 ok 放行，终态靠事件流。
    if (!response.ok && response.status !== 202) {
      throw new Error(data.error || ("HTTP " + response.status));
    }
    return data;
  }

  function render(messages) {
    // 整段重画只在内容真的变了的时候做，否则会打断正在输入的选词
    const signature = JSON.stringify(messages);
    if (signature === rendered) return;
    rendered = signature;

    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    list.innerHTML = "";
    for (const message of messages) {
      const row = document.createElement("div");
      row.className = "row " + message.role + (message.error ? " error" : "");

      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = (message.role === "user" ? "你" : "愛花") + " · " + (message.time || "");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.text;
      if (message.translation) {
        const translation = document.createElement("div");
        translation.className = "translation";
        translation.textContent = message.translation;
        bubble.appendChild(translation);
      }
      row.append(meta, bubble);
      list.appendChild(row);
    }
    if (atBottom) list.scrollTop = list.scrollHeight;
  }

  // 事件帧 → 消息。reply 帧带 replyText/translation/mood；status 帧表状态。
  // 投影是白名单的（没有 memoryCandidates），手机端只认这几个字段。
  // 用 turnId 做键：同一轮的 status→reply→settled 不会各造一条消息。
  const messages = new Map();

  function applyFrame(frame) {
    const payload = frame && frame.payload;
    if (!payload) return;
    const key = String(frame.turnId || (frame.cursor && frame.cursor.seq) || "");
    if (payload.channel === "reply" && payload.reply) {
      messages.set(key, {
        role: "assistant",
        text: payload.reply.replyText || "",
        translation: payload.reply.translation || null,
        time: timeNow(),
      });
      render([...messages.values()]);
      say("电脑关机时这里就没有回应了——记忆只有电脑上那一份。", false);
      return;
    }
    if (payload.channel === "status" && payload.status) {
      const code = payload.status.code;
      if (code === "turn-state") say("她正在想…", false);
      if (code === "settled") say("这一轮说完了。", false);
      // 错误状态只显示白名单里的 code，不显示任何内部 message。
      if (code && code !== "pong" && code !== "turn-state" && code !== "settled") {
        say("这一轮没能完成（" + code + "）。", true);
      }
    }
  }

  function timeNow() {
    const now = new Date();
    return now.toTimeString().slice(0, 5);
  }

  // 长轮询：宿主会挂住最多 25s，有新帧或状态变化才返回。
  async function poll() {
    if (polling || stopped) return;
    polling = true;
    try {
      const query = new URLSearchParams({ conversation: CONVERSATION });
      if (epoch) query.set("epoch", epoch);
      if (cursor !== null && cursor !== undefined) query.set("cursor", String(cursor));
      const data = await call("/api/v1/events?" + query.toString());
      epoch = data.epoch || epoch;
      if (data.gap) {
        // 明确告知重同步，而不是假装连续。
        say("连接重新同步中…", false);
      }
      for (const raw of data.events || []) {
        let frame = null;
        try { frame = typeof raw === "string" ? JSON.parse(raw) : raw; } catch { continue; }
        if (frame && frame.cursor && typeof frame.cursor.seq === "number") cursor = frame.cursor.seq;
        applyFrame(frame);
      }
      if (data.runtimeStatus === "online") {
        online(true, "已连上电脑");
      } else {
        online(false, "电脑上还没配置模型");
      }
    } catch (error) {
      online(false, "连不上电脑");
      say(String(error.message || error), true);
      // 出错后退避再试，不要把宿主打满。
      await new Promise((resolve) => setTimeout(resolve, 2000));
    } finally {
      polling = false;
      if (!stopped) setTimeout(poll, 0);
    }
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    sendButton.disabled = true;
    input.value = "";
    say("已经发过去了，等她说完这一轮…");

    try {
      // messageId 由客户端生成：宿主按 主体+会话+messageId 去重，重放不会重复提交。
      const messageId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
      messages.set(messageId, { role: "user", text, time: timeNow() });
      render([...messages.values()]);
      const data = await call("/api/v1/commands", {
        method: "POST",
        body: JSON.stringify({ schemaVersion: 1, type: "submit", messageId, text, conversationId: CONVERSATION }),
      });
      if (data.error) say(data.error, true);
      else say("她收到了，正在想…", false);
    } catch (error) {
      // 发失败时把话还给用户，不要让他重打一遍
      input.value = text;
      say(String(error.message || error), true);
    } finally {
      sending = false;
      sendButton.disabled = false;
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  if (!token) {
    online(false, "缺 token");
    say("这个链接少了 token。在电脑上的设置页重新复制一次手机地址。", true);
  } else {
    loadHistory();
    poll();
  }

  // 首屏历史：拉一次就好，之后的增量靠事件流。
  async function loadHistory() {
    try {
      const data = await call("/api/v1/history");
      for (const message of data.messages || []) {
        // 历史消息没有 turnId，用文本+时间做稳定键避免重复。
        messages.set("h:" + (message.time || "") + ":" + (message.text || "").slice(0, 24), message);
      }
      render([...messages.values()]);
    } catch (error) {
      say(String(error.message || error), true);
    }
  }
</script>
</body>
</html>
