name: Windows source checks
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code/desktop-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/desktop-pet/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run test:windows
      - run: npm run test:release
      # The private rig and SDK are deliberately absent from source control.
