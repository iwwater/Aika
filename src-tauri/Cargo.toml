[package]
name = "petshell"
version = "0.6.0"
description = "PetShell desktop pet sidecar for the Aiki companion runtime"
authors = ["PetShell contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "petshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
toml = "0.9"
url = "2.5.8"
